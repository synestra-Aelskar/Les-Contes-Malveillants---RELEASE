# Publie une Release GitHub a chaque tag de version (v3.0.0, v3.0.1…).
#
# Depuis la v3 (19 novembre 2026), LCM est une application (l'overlay) et un
# petit module en jeu. Le joueur telecharge un zip qui contient :
#   * Les Contes Malveillants v3.0.exe : l'application, a lancer sous Windows ;
#   * LCMCoreAddon/ : le module en jeu, a deposer dans Interface/AddOns.
# L'archive « Source code » que GitHub ajoute d'office n'est pas celle a prendre.
#
# Les notes de la Release sont le message du tag annote (git tag -a).
# Un tag qui ne correspond pas au fichier VERSION est refuse : une Release
# « 3.0.1 » qui livrerait la 3.0.0 mentirait au joueur.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot et le tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier le contenu et la version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXE="Les Contes Malveillants v3.0.exe"
          TOC="LCMCoreAddon/LCMCoreAddon.toc"
          for f in "$EXE" "$TOC" VERSION; do
            if [ ! -f "$f" ]; then echo "::error::$f introuvable a la racine du depot."; exit 1; fi
          done
          DECLAREE="$(head -n1 VERSION | tr -d '\r[:space:]')"
          if [ "$DECLAREE" != "$VERSION" ]; then
            echo "::error::le tag $TAG ne correspond pas au fichier VERSION ($DECLAREE)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fabriquer le zip
        run: |
          ZIP="LesContesMalveillants-${VERSION}.zip"
          git archive --format=zip -o "$ZIP" "$GITHUB_REF_NAME" "Les Contes Malveillants v3.0.exe" LCMCoreAddon
          unzip -l "$ZIP" | tail -n 1
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Notes depuis le message du tag
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then
            echo "Les Contes Malveillants ${VERSION}." > notes.md
          fi

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Relancer le workflow sur un tag deja publie remplace le zip au
          # lieu d'echouer.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "Les Contes Malveillants ${VERSION}" \
              --notes-file notes.md
          fi
